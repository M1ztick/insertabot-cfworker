<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#0e1320" />
		<meta name="mobile-web-app-capable" content="yes" />
		<title>InsertaBot</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--bg: #080b12;
				--surface: #0e1320;
				--surface2: #141a2e;
				--border: rgba(255, 255, 255, 0.07);
				--border-cyan: rgba(0, 245, 212, 0.3);
				--border-magenta: rgba(245, 0, 160, 0.35);
				--text: #e8eaf2;
				--text-muted: #6b7399;
				--cyan: #00f5d4;
				--magenta: #f500a0;
				--accent: #00f5d4;
				--accent-dim: rgba(0, 245, 212, 0.12);
			}

			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			html,
			body {
				block-size: 100%;
				overflow: hidden;
			}

			body {
				/* Dynamic viewport unit so the layout tracks the mobile browser's
				   collapsing address bar instead of being clipped by it. */
				block-size: 100dvh;
				/* Stops iOS Safari from rubber-banding the whole page while the
				   message list is being scrolled. */
				overscroll-behavior: none;
				-webkit-text-size-adjust: 100%;
				font-family:
					'Syne',
					-apple-system,
					BlinkMacSystemFont,
					sans-serif;
				background: var(--bg);
				color: var(--text);
				display: flex;
				flex-direction: column;
			}

			/* ── Grid background ── */
			body::before {
				content: '';
				position: fixed;
				inset: 0;
				background-image:
					linear-gradient(rgba(0, 245, 212, 0.025) 1px, transparent 1px),
					linear-gradient(90deg, rgba(0, 245, 212, 0.025) 1px, transparent 1px);
				background-size: 40px 40px;
				pointer-events: none;
				z-index: 0;
			}

			/* ── Header ── */
			header {
				position: relative;
				z-index: 1;
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 14px 20px;
				border-block-end: 1px solid var(--border);
				background: var(--surface);
				flex-shrink: 0;
			}

			header svg {
				flex-shrink: 0;
			}

			header h1 {
				font-family: 'Space Mono', monospace;
				font-size: 0.85rem;
				font-weight: 700;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				color: var(--text);
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				min-inline-size: 0;
			}

			.status {
				margin-inline-start: auto;
				display: flex;
				align-items: center;
				gap: 6px;
				font-family: 'Space Mono', monospace;
				font-size: 0.72rem;
				color: var(--text-muted);
				min-inline-size: 0;
			}

			.status #status-text {
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			.dot {
				inline-size: 7px;
				block-size: 7px;
				border-radius: 50%;
				background: #333;
				transition: background 0.4s;
			}
			.dot.on {
				background: var(--cyan);
				box-shadow: 0 0 8px rgba(0, 245, 212, 0.5);
			}

			/* ── Plan badge ── */
			.plan-badge {
				display: inline-flex;
				align-items: center;
				gap: 5px;
				font-family: 'Space Mono', monospace;
				font-size: 0.65rem;
				font-weight: 700;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				padding: 3px 8px;
				border-radius: 20px;
				border: 1px solid;
				white-space: nowrap;
			}
			.plan-badge.demo  { color: var(--cyan);    border-color: rgba(0,245,212,0.35);  background: rgba(0,245,212,0.07); }
			.plan-badge.light { color: var(--text-muted); border-color: var(--border);       background: transparent; }
			.plan-badge.plus  { color: #a78bfa;          border-color: rgba(167,139,250,0.4); background: rgba(167,139,250,0.08); }
			.plan-badge.agent { color: var(--magenta);   border-color: var(--border-magenta); background: rgba(245,0,160,0.07); }

			/* ── Demo banner ── */
			.demo-banner {
				display: none;
				position: relative;
				z-index: 1;
				background: rgba(0, 245, 212, 0.06);
				border-block-end: 1px solid rgba(0, 245, 212, 0.15);
				padding: 7px 20px;
				text-align: center;
				font-family: 'Space Mono', monospace;
				font-size: 0.68rem;
				color: var(--text-muted);
				flex-shrink: 0;
			}
			.demo-banner a { color: var(--cyan); text-decoration: none; }
			.demo-banner a:hover { text-decoration: underline; }
			.demo-banner.visible { display: block; }

			.btn-ghost {
				background: none;
				border: 1px solid var(--border);
				border-radius: 8px;
				color: var(--text-muted);
				font-family: 'Space Mono', monospace;
				font-size: 0.72rem;
				padding: 5px 11px;
				cursor: pointer;
				transition:
					border-color 0.2s,
					color 0.2s;
				white-space: nowrap;
				letter-spacing: 0.05em;
			}
			.btn-ghost:hover {
				border-color: var(--border-cyan);
				color: var(--cyan);
			}

			.btn-ghost .btn-icon {
				display: inline-block;
				vertical-align: -1px;
				margin-inline-end: 5px;
			}

			/* ── Messages ── */
			#messages {
				flex: 1;
				position: relative;
				z-index: 1;
				overflow-y: auto;
				padding: 28px 16px 12px;
				display: flex;
				flex-direction: column;
				gap: 18px;
				scrollbar-width: thin;
				scrollbar-color: var(--border) transparent;
			}

			.empty-state {
				margin: auto;
				text-align: center;
				color: var(--text-muted);
				user-select: none;
			}

			.empty-state h2 {
				font-family: 'Space Mono', monospace;
				font-size: 1.3rem;
				font-weight: 700;
				letter-spacing: 0.08em;
				color: var(--cyan);
				margin-block-end: 12px;
				text-shadow: 0 0 20px rgba(0, 245, 212, 0.3);
			}

			.empty-state p {
				font-size: 0.88rem;
				line-height: 1.7;
				max-inline-size: 320px;
				color: var(--text-muted);
			}

			.msg-row {
				display: flex;
				gap: 10px;
				max-inline-size: 720px;
				inline-size: 100%;
				margin: 0 auto;
				animation: slide-in 0.18s ease;
			}

			@keyframes slide-in {
				from {
					opacity: 0;
					transform: translateY(6px);
				}
				to {
					opacity: 1;
					transform: none;
				}
			}

			.msg-row.user {
				flex-direction: row-reverse;
			}

			.avatar {
				inline-size: 30px;
				block-size: 30px;
				border-radius: 50%;
				flex-shrink: 0;
				font-family: 'Space Mono', monospace;
				font-size: 0.65rem;
				font-weight: 700;
				display: flex;
				align-items: center;
				justify-content: center;
				margin-block-start: 2px;
			}

			.msg-row.user .avatar {
				background: var(--accent-dim);
				border: 1px solid var(--border-cyan);
				color: var(--cyan);
			}

			.msg-row.assistant .avatar {
				background: var(--surface2);
				border: 1px solid var(--border);
				color: var(--text-muted);
			}

			.bubble {
				padding: 10px 14px;
				border-radius: 12px;
				line-height: 1.7;
				font-size: 0.9rem;
				max-inline-size: calc(100% - 44px);
				word-break: break-word;
			}

			.msg-row.user .bubble {
				background: var(--surface2);
				border: 1px solid var(--border-cyan);
				white-space: pre-wrap;
			}

			.msg-row.assistant .bubble {
				background: var(--surface2);
				border: 1px solid var(--border);
				padding: 14px 18px;
			}

			/* Markdown rendered content */
			.bubble-content p {
				margin-block-end: 0.75em;
				line-height: 1.75;
			}
			.bubble-content p:last-child {
				margin-block-end: 0;
			}
			.bubble-content ul,
			.bubble-content ol {
				padding-inline-start: 1.5em;
				margin-block-end: 0.75em;
			}
			.bubble-content li {
				margin-block-end: 0.35em;
				line-height: 1.65;
			}
			.bubble-content strong {
				color: var(--text);
				font-weight: 700;
			}
			.bubble-content em {
				color: var(--text-muted);
			}
			.bubble-content code {
				font-family: 'Space Mono', monospace;
				font-size: 0.8em;
				background: rgba(0, 245, 212, 0.08);
				border: 1px solid rgba(0, 245, 212, 0.15);
				border-radius: 4px;
				padding: 2px 6px;
				color: var(--cyan);
			}
			.bubble-content pre {
				background: var(--bg);
				border: 1px solid var(--border);
				border-radius: 8px;
				padding: 14px 16px;
				overflow-x: auto;
				margin-block: 1em;
			}
			.bubble-content pre code {
				background: none;
				border: none;
				padding: 0;
				font-size: 0.82em;
				color: var(--text);
			}
			.bubble-content h1,
			.bubble-content h2,
			.bubble-content h3 {
				font-family: 'Space Mono', monospace;
				font-weight: 700;
				letter-spacing: 0.03em;
				color: var(--text);
				line-height: 1.3;
			}
			.bubble-content h1 {
				font-size: 1.3em;
				margin-block: 1.2em 0.6em;
				color: var(--cyan);
				border-block-end: 1px solid rgba(0, 245, 212, 0.15);
				padding-block-end: 0.3em;
			}
			.bubble-content h2 {
				font-size: 1.1em;
				margin-block: 1.1em 0.5em;
				color: var(--text);
				padding-inline-start: 10px;
				border-inline-start: 2px solid var(--border-cyan);
			}
			.bubble-content h3 {
				font-size: 0.95em;
				margin-block: 1em 0.4em;
				color: var(--text-muted);
				text-transform: uppercase;
				letter-spacing: 0.07em;
			}
			.bubble-content h1:first-child,
			.bubble-content h2:first-child,
			.bubble-content h3:first-child {
				margin-block-start: 0;
			}
			.bubble-content a {
				color: var(--cyan);
				text-decoration: none;
			}
			.bubble-content a:hover {
				text-decoration: underline;
			}
			.bubble-content blockquote {
				border-inline-start: 2px solid var(--border-cyan);
				padding-inline-start: 14px;
				color: var(--text-muted);
				margin-block: 0.75em;
				font-style: italic;
			}
			.bubble-content hr {
				border: none;
				border-block-start: 1px solid var(--border);
				margin-block: 1em;
			}
			.bubble-content table {
				inline-size: 100%;
				border-collapse: collapse;
				font-size: 0.85em;
				margin-block: 0.75em;
			}
			.bubble-content th,
			.bubble-content td {
				padding: 7px 12px;
				border: 1px solid var(--border);
				text-align: start;
			}
			.bubble-content th {
				background: var(--surface);
				font-family: 'Space Mono', monospace;
				font-size: 0.78em;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--text-muted);
			}

			.msg-img {
				max-inline-size: 100%;
				max-block-size: 260px;
				border-radius: 8px;
				display: block;
				margin-block-start: 8px;
				cursor: pointer;
				border: 1px solid var(--border);
			}

			/* Streaming cursor */
			.cursor {
				display: inline-block;
				inline-size: 2px;
				block-size: 0.9em;
				background: var(--cyan);
				margin-inline-start: 2px;
				vertical-align: text-bottom;
				animation: blink 0.9s step-end infinite;
			}
			@keyframes blink {
				50% {
					opacity: 0;
				}
			}

			/* Tool call pill */
			.tool-pill {
				display: inline-flex;
				align-items: center;
				gap: 5px;
				background: rgba(0, 245, 212, 0.07);
				border: 1px solid rgba(0, 245, 212, 0.2);
				border-radius: 6px;
				padding: 3px 9px;
				font-family: 'Space Mono', monospace;
				font-size: 0.72rem;
				color: var(--cyan);
				margin: 4px 0;
				opacity: 0.75;
			}

			.tool-pill::before {
				content: '⚙';
				font-size: 0.7rem;
			}

			/* ── Input area ── */
			.input-wrap {
				position: relative;
				z-index: 1;
				flex-shrink: 0;
				background: var(--surface);
				border-block-start: 1px solid var(--border);
				padding: 10px 16px 14px;
			}

			#preview-strip {
				display: none;
				flex-direction: row;
				flex-wrap: wrap;
				gap: 8px;
				max-inline-size: 720px;
				margin: 0 auto 10px;
			}

			.preview-thumb {
				position: relative;
			}

			.preview-thumb img {
				block-size: 60px;
				inline-size: 60px;
				object-fit: cover;
				border-radius: 8px;
				border: 1px solid var(--border-cyan);
				display: block;
			}

			.preview-remove {
				position: absolute;
				inset-block-start: -6px;
				inset-inline-end: -6px;
				inline-size: 18px;
				block-size: 18px;
				background: var(--surface2);
				border: 1px solid var(--border);
				border-radius: 50%;
				color: var(--text-muted);
				font-size: 11px;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 0;
				line-height: 1;
				transition:
					border-color 0.2s,
					color 0.2s;
			}
			.preview-remove:hover {
				border-color: var(--magenta);
				color: var(--magenta);
			}

			.input-inner {
				max-inline-size: 720px;
				margin: 0 auto;
				display: flex;
				gap: 8px;
				align-items: flex-end;
			}

			button#attach {
				block-size: 42px;
				inline-size: 42px;
				background: var(--surface2);
				border: 1px solid var(--border);
				border-radius: 10px;
				color: var(--text-muted);
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				flex-shrink: 0;
				transition:
					border-color 0.2s,
					color 0.2s;
			}
			button#attach:hover {
				border-color: var(--border-cyan);
				color: var(--cyan);
			}
			button#attach:disabled {
				opacity: 0.35;
				cursor: not-allowed;
			}

			textarea {
				flex: 1;
				min-block-size: 42px;
				max-block-size: 160px;
				padding: 10px 13px;
				background: var(--surface2);
				border: 1px solid var(--border);
				border-radius: 10px;
				color: var(--text);
				font-family: 'Syne', sans-serif;
				font-size: 0.9rem;
				line-height: 1.5;
				resize: none;
				outline: none;
				transition: border-color 0.2s;
			}
			textarea:focus {
				border-color: var(--border-cyan);
			}
			textarea::placeholder {
				color: var(--text-muted);
			}
			textarea:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}

			button#send {
				block-size: 42px;
				padding: 0 18px;
				background: var(--cyan);
				border: none;
				border-radius: 10px;
				color: var(--bg);
				font-family: 'Space Mono', monospace;
				font-size: 0.78rem;
				font-weight: 700;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				cursor: pointer;
				white-space: nowrap;
				transition:
					opacity 0.2s,
					box-shadow 0.2s;
				flex-shrink: 0;
			}
			button#send:disabled {
				opacity: 0.35;
				cursor: not-allowed;
			}
			button#send:not(:disabled):hover {
				opacity: 0.85;
				box-shadow: 0 0 16px rgba(0, 245, 212, 0.3);
			}

			/* ── Add-ons panel ── */
			.addons-backdrop {
				display: none;
				position: fixed;
				inset: 0;
				background: rgba(0, 0, 0, 0.55);
				z-index: 50;
			}
			.addons-backdrop.open { display: block; }

			.addons-panel {
				position: fixed;
				inset-block: 0;
				inset-inline-end: 0;
				inline-size: 320px;
				max-inline-size: 100vw;
				background: var(--surface);
				border-inline-start: 1px solid var(--border);
				z-index: 51;
				display: flex;
				flex-direction: column;
				transform: translateX(100%);
				transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
			}
			.addons-panel.open { transform: translateX(0); }

			.addons-header {
				display: flex;
				align-items: center;
				padding: 14px 18px;
				border-block-end: 1px solid var(--border);
				flex-shrink: 0;
				gap: 8px;
			}
			.addons-title {
				font-family: 'Space Mono', monospace;
				font-size: 0.78rem;
				font-weight: 700;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				color: var(--text);
				flex: 1;
			}
			.addons-close {
				background: none;
				border: none;
				color: var(--text-muted);
				font-size: 1.1rem;
				cursor: pointer;
				padding: 3px 6px;
				line-height: 1;
				border-radius: 6px;
				transition: color 0.2s;
			}
			.addons-close:hover { color: var(--text); }

			.addons-body {
				flex: 1;
				overflow-y: auto;
				padding: 18px;
				display: flex;
				flex-direction: column;
				gap: 22px;
				scrollbar-width: thin;
				scrollbar-color: var(--border) transparent;
			}

			.addons-section-title {
				font-family: 'Space Mono', monospace;
				font-size: 0.66rem;
				font-weight: 700;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				color: var(--text-muted);
				margin-block-end: 10px;
			}

			.addons-empty {
				color: var(--text-muted);
				font-size: 0.82rem;
				text-align: center;
				padding: 12px 0;
				line-height: 1.6;
			}

			.server-card {
				background: var(--surface2);
				border: 1px solid var(--border);
				border-radius: 10px;
				padding: 12px 14px;
				margin-block-end: 8px;
			}
			.server-card:last-child { margin-block-end: 0; }

			.server-card-top {
				display: flex;
				align-items: center;
				gap: 8px;
				margin-block-end: 8px;
			}

			.server-status-dot {
				inline-size: 8px;
				block-size: 8px;
				border-radius: 50%;
				flex-shrink: 0;
			}
			.server-status-dot.ready {
				background: var(--cyan);
				box-shadow: 0 0 6px rgba(0, 245, 212, 0.4);
			}
			.server-status-dot.connecting {
				background: #f5b800;
				animation: pulse-dot 1s step-end infinite;
			}
			.server-status-dot.failed { background: var(--magenta); }
			.server-status-dot.authenticating { background: #f57800; }
			.server-status-dot.other { background: #555; }
			@keyframes pulse-dot { 50% { opacity: 0.35; } }

			.server-name {
				font-family: 'Space Mono', monospace;
				font-size: 0.78rem;
				font-weight: 700;
				color: var(--text);
				flex: 1;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.server-disconnect {
				background: none;
				border: 1px solid var(--border);
				border-radius: 6px;
				color: var(--text-muted);
				font-family: 'Space Mono', monospace;
				font-size: 0.62rem;
				padding: 3px 9px;
				cursor: pointer;
				transition:
					border-color 0.2s,
					color 0.2s;
				white-space: nowrap;
				flex-shrink: 0;
			}
			.server-disconnect:hover:not(:disabled) {
				border-color: var(--border-magenta);
				color: var(--magenta);
			}
			.server-disconnect:disabled { opacity: 0.4; cursor: not-allowed; }

			.server-error {
				font-size: 0.74rem;
				color: var(--magenta);
				margin-block-end: 6px;
				line-height: 1.4;
			}

			.addons-auth-link {
				display: inline-block;
				font-family: 'Space Mono', monospace;
				font-size: 0.7rem;
				color: #f57800;
				text-decoration: none;
				margin-block-end: 6px;
			}
			.addons-auth-link:hover { text-decoration: underline; }

			.server-tools {
				display: flex;
				flex-wrap: wrap;
				gap: 5px;
			}
			.tool-chip {
				font-family: 'Space Mono', monospace;
				font-size: 0.62rem;
				background: rgba(0, 245, 212, 0.06);
				border: 1px solid rgba(0, 245, 212, 0.14);
				border-radius: 5px;
				padding: 2px 7px;
				color: var(--text-muted);
				cursor: default;
			}

			/* Connect form */
			.addons-form {
				display: flex;
				flex-direction: column;
				gap: 12px;
			}
			.addons-field label {
				font-family: 'Space Mono', monospace;
				font-size: 0.64rem;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--text-muted);
				display: block;
				margin-block-end: 5px;
			}
			.addons-field input {
				inline-size: 100%;
				padding: 9px 12px;
				background: var(--surface2);
				border: 1px solid var(--border);
				border-radius: 8px;
				color: var(--text);
				font-family: 'Syne', sans-serif;
				font-size: 0.85rem;
				outline: none;
				transition: border-color 0.2s;
			}
			.addons-field input:focus { border-color: var(--border-cyan); }
			.addons-field input::placeholder { color: var(--text-muted); }

			.addons-form-error {
				font-size: 0.74rem;
				color: var(--magenta);
				line-height: 1.4;
				min-block-size: 1em;
			}

			.addons-connect-btn {
				inline-size: 100%;
				padding: 10px;
				background: var(--surface2);
				border: 1px solid var(--border-cyan);
				border-radius: 8px;
				color: var(--cyan);
				font-family: 'Space Mono', monospace;
				font-size: 0.72rem;
				font-weight: 700;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				cursor: pointer;
				transition:
					background 0.2s,
					opacity 0.2s;
			}
			.addons-connect-btn:hover:not(:disabled) { background: rgba(0, 245, 212, 0.1); }
			.addons-connect-btn:disabled { opacity: 0.35; cursor: not-allowed; }

			/* ── Lightbox ── */
			#lightbox {
				display: none;
				position: fixed;
				inset: 0;
				background: rgba(0, 0, 0, 0.88);
				align-items: center;
				justify-content: center;
				z-index: 100;
				cursor: zoom-out;
			}
			#lightbox.open {
				display: flex;
			}
			#lightbox img {
				max-inline-size: 92vw;
				max-block-size: 92vh;
				border-radius: 8px;
				border: 1px solid var(--border-cyan);
			}

			/* ════════════════════════════════════════════════════════════════
			   Mobile / touch
			   ════════════════════════════════════════════════════════════════ */

			/* Respect the notch + home indicator on iOS (viewport-fit=cover). */
			header {
				padding-inline: max(20px, env(safe-area-inset-left))
					max(20px, env(safe-area-inset-right));
			}
			.input-wrap {
				padding-block-end: calc(14px + env(safe-area-inset-bottom));
				padding-inline: max(16px, env(safe-area-inset-left))
					max(16px, env(safe-area-inset-right));
			}

			/* Give every interactive control a ≥44px touch target and remove the
			   grey tap flash Android/iOS add by default. */
			@media (hover: none) and (pointer: coarse) {
				button,
				a,
				input,
				textarea {
					-webkit-tap-highlight-color: transparent;
				}
				.btn-ghost,
				.server-disconnect,
				.addons-close {
					min-block-size: 44px;
					display: inline-flex;
					align-items: center;
					justify-content: center;
				}
				#addons-btn,
				#new-chat {
					min-inline-size: 44px;
					min-block-size: 44px;
				}
				.preview-remove {
					inline-size: 26px;
					block-size: 26px;
					font-size: 15px;
					inset-block-start: -8px;
					inset-inline-end: -8px;
				}
				/* Hover styles stick after a tap on touch devices — neutralise them. */
				.btn-ghost:hover {
					border-color: var(--border);
					color: var(--text-muted);
				}
				button#send:not(:disabled):hover {
					opacity: 1;
					box-shadow: none;
				}
			}

			@media (max-width: 720px) {
				header {
					/* Single compact row. The header previously laid out six
					   non-shrinking items, so on a ~360px screen the total width
					   exceeded the viewport and shoved the layout sideways —
					   which is what clipped the send button off the right edge. */
					gap: 6px;
					padding: 6px 12px;
					padding-inline: max(12px, env(safe-area-inset-left))
						max(12px, env(safe-area-inset-right));
				}
				header h1 {
					font-size: 0.78rem;
					letter-spacing: 0.08em;
					/* Never ellipsise the brand name — other header items give way. */
					flex-shrink: 0;
					overflow: visible;
				}
				header > svg {
					inline-size: 20px;
					block-size: 20px;
				}
				.plan-badge {
					font-size: 0.58rem;
					padding: 2px 6px;
				}
				.status {
					font-size: 0.65rem;
					gap: 5px;
				}
				/* Collapse the header buttons to icons — the labels are what
				   made the row overflow. aria-label keeps them accessible. */
				#addons-btn .btn-label,
				#new-chat .btn-label {
					display: none;
				}
				#addons-btn .btn-icon,
				#new-chat .btn-icon {
					margin-inline-end: 0;
				}
				#addons-btn,
				#new-chat {
					/* Square 44px touch target, sized by viewport width rather than
					   the pointer:coarse query so it does not depend on the browser
					   reporting a coarse pointer. */
					inline-size: 44px;
					block-size: 44px;
					padding: 0;
					flex-shrink: 0;
					display: inline-flex;
					align-items: center;
					justify-content: center;
				}
				#addons-btn .btn-icon,
				#new-chat .btn-icon {
					inline-size: 16px;
					block-size: 16px;
				}

				#messages {
					padding: 16px 12px 8px;
					gap: 14px;
					/* Momentum scrolling + contain overscroll to the list. */
					-webkit-overflow-scrolling: touch;
					overscroll-behavior-y: contain;
				}

				.msg-row {
					gap: 8px;
				}
				.avatar {
					inline-size: 26px;
					block-size: 26px;
					font-size: 0.58rem;
				}
				.bubble {
					/* Was calc(100% - 44px), which left very little room on a 360px
					   screen. Narrower avatars buy the bubble ~8px back. */
					max-inline-size: calc(100% - 34px);
					font-size: 0.92rem;
					padding: 10px 12px;
				}
				.msg-row.assistant .bubble {
					padding: 12px 14px;
				}

				/* Long unbroken strings (URLs, tokens, identifiers) must not force
				   the bubble wider than the screen. */
				.bubble-content {
					overflow-wrap: anywhere;
				}
				.bubble-content pre {
					padding: 10px 12px;
					font-size: 0.9em;
				}
				/* Tables scroll horizontally instead of stretching the layout. */
				.bubble-content table {
					display: block;
					overflow-x: auto;
					white-space: nowrap;
				}

				.empty-state h2 {
					font-size: 1.1rem;
				}
				.empty-state p {
					font-size: 0.85rem;
					max-inline-size: 280px;
				}

				.input-wrap {
					padding: 8px 12px;
					padding-block-end: calc(10px + env(safe-area-inset-bottom));
					padding-inline: max(12px, env(safe-area-inset-left))
						max(12px, env(safe-area-inset-right));
				}
				.input-inner {
					gap: 6px;
				}
				button#attach {
					inline-size: 44px;
					block-size: 44px;
				}
				textarea {
					min-block-size: 44px;
					max-block-size: 120px;
					/* iOS zooms the page when a focused input is under 16px. */
					font-size: 16px;
					padding: 11px 12px;
				}
				button#send {
					block-size: 44px;
					/* Icon-only on narrow screens: the word "SEND" plus the attach
					   button and textarea could not fit, which pushed the button
					   past the right edge of the viewport. */
					inline-size: 44px;
					padding: 0;
					font-size: 0;
				}
				button#send::after {
					content: '➤';
					font-size: 1rem;
					line-height: 1;
				}

				/* Full-width slide-over sheet rather than a 320px desktop drawer. */
				.addons-panel {
					inline-size: 100%;
					max-inline-size: 100%;
				}
				.addons-body {
					padding: 16px;
					padding-block-end: calc(16px + env(safe-area-inset-bottom));
				}
				.addons-field input {
					font-size: 16px;
					padding: 11px 12px;
				}
				.addons-connect-btn {
					padding: 13px;
				}
			}

			/* Header space priority on small screens. The brand name must never
			   truncate, so the least important items are dropped first:
			   plan badge → status label. The connection dot always stays. */
			@media (max-width: 480px) {
				.plan-badge {
					display: none;
				}
			}
			@media (max-width: 400px) {
				.status #status-text {
					display: none;
				}
			}

			/* Landscape phones are short — reclaim vertical space. */
			@media (max-height: 480px) and (orientation: landscape) {
				header {
					padding-block: 6px;
				}
				#messages {
					padding-block-start: 10px;
				}
				.demo-banner {
					display: none !important;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				*,
				*::before,
				*::after {
					animation-duration: 0.01ms !important;
					animation-iteration-count: 1 !important;
					transition-duration: 0.01ms !important;
				}
			}
		</style>
	</head>
	<body>
		<header>
			<svg
				width="22"
				height="22"
				viewBox="0 0 24 24"
				fill="none"
				stroke="var(--cyan)"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round"
			>
				<rect x="3" y="11" width="18" height="10" rx="2" />
				<circle cx="12" cy="5" r="2" />
				<line x1="12" y1="7" x2="12" y2="11" />
				<line x1="8" y1="15" x2="8" y2="17" />
				<line x1="16" y1="15" x2="16" y2="17" />
			</svg>
			<h1>InsertaBot</h1>
			<span class="plan-badge demo" id="plan-badge" title="Current plan">Demo</span>
			<div class="status">
				<div class="dot" id="dot"></div>
				<span id="status-text">Connecting…</span>
			</div>
			<button class="btn-ghost" id="addons-btn" title="Add-ons &amp; integrations" aria-label="Add-ons and integrations">
				<svg class="btn-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M12 22v-5"/>
					<path d="M9 8V2"/>
					<path d="M15 8V2"/>
					<path d="M18 8H6a2 2 0 0 0-2 2v3a7 7 0 0 0 14 0v-3a2 2 0 0 0-2-2z"/>
				</svg><span class="btn-label">Add-ons</span>
			</button>
			<button class="btn-ghost" id="new-chat" title="Start a new chat" aria-label="Start a new chat">
				<svg class="btn-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M12 5v14"/>
					<path d="M5 12h14"/>
				</svg><span class="btn-label">New chat</span>
			</button>
		</header>

		<div class="demo-banner" id="demo-banner">
			You're using the InsertaBot demo. <a href="https://insertabot.io" target="_blank" rel="noopener noreferrer">Visit insertabot.io</a> to pick a plan.
		</div>

		<div class="addons-backdrop" id="addons-backdrop"></div>
		<aside class="addons-panel" id="addons-panel" aria-label="Add-ons">
			<div class="addons-header">
				<span class="addons-title">Add-ons</span>
				<button class="addons-close" id="addons-close" aria-label="Close">✕</button>
			</div>
			<div class="addons-body">
				<section>
					<p class="addons-section-title">Connected</p>
					<div id="addons-servers">
						<p class="addons-empty">No servers connected yet.</p>
					</div>
				</section>
				<section>
					<p class="addons-section-title">Connect a server</p>
					<div class="addons-form">
						<div class="addons-field">
							<label for="addons-name">Name <span style="opacity:.5;font-weight:400">(optional)</span></label>
							<input id="addons-name" type="text" placeholder="e.g. My GitHub Tools" autocomplete="off" />
						</div>
						<div class="addons-field">
							<label for="addons-url">Server URL</label>
							<input id="addons-url" type="url" placeholder="https://…" autocomplete="off" />
						</div>
						<div class="addons-field">
							<label for="addons-token">Access token <span style="opacity:.5;font-weight:400">(optional)</span></label>
							<input id="addons-token" type="password" placeholder="e.g. ghp_…" autocomplete="off" />
						</div>
						<div class="addons-form-error" id="addons-form-error"></div>
						<button class="addons-connect-btn" id="addons-connect-btn">Connect</button>
					</div>
				</section>
			</div>
		</aside>

		<div id="messages"></div>

		<div id="lightbox"><img id="lightbox-img" src="" alt="" /></div>

		<div class="input-wrap">
			<div id="preview-strip"></div>
			<div class="input-inner">
				<button id="attach" title="Attach image" disabled>
					<svg
						width="18"
						height="18"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
					</svg>
				</button>
				<input type="file" id="file-input" accept="image/*" multiple hidden />
				<textarea id="input" placeholder="Message InsertaBot…" rows="1" disabled></textarea>
				<button id="send" disabled>Send</button>
			</div>
		</div>

		<script src="index.js" type="module" defer></script>
	</body>
</html>
